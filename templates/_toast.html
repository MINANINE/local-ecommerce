<!-- Toast 提示组件 - 通过 flash 变量控制显示 -->
{% if flash %}
<div id="toast" class="toast toast-{{ flash.type }}" style="
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 14px 28px; border-radius: 8px; color: white; font-size: 16px;
    z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    animation: toastIn 0.4s ease;
    {% if flash.type == 'success' %}background: #28a745;{% else %}background: #dc3545;{% endif %}
">{{ flash.msg }}</div>

<style>
@keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes toastOut {
    from { opacity: 1; transform: translateX(-50%) translateY(0); }
    to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
}
</style>

<script>
setTimeout(function() {
    var toast = document.getElementById('toast');
    if (toast) {
        toast.style.animation = 'toastOut 0.4s ease forwards';
        setTimeout(function() { toast.remove(); }, 400);
    }
}, 2500);
</script>
{% endif %}
